name: MLOps CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Validate Docker build
        run: docker build -t student-ml-api:ci .
