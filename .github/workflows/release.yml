name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Extract version from Git tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
           
      - name: Extract short commit SHA
        id: commit
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Generate build date
        id: build_date
        shell: bash
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.VERSION }}" \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            --build-arg BUILD_DATE="${{ steps.build_date.outputs.BUILD_DATE }}" \
            -t ghcr.io/samiyasaleem/student-ml-api:${{ steps.version.outputs.VERSION }} \
            -t ghcr.io/samiyasaleem/student-ml-api:latest \
            -t ghcr.io/samiyasaleem/student-ml-api:${{ steps.commit.outputs.SHORT_SHA }} \
            .         


      - name: Push versioned Docker image
        run: |
          docker push ghcr.io/samiyasaleem/student-ml-api:${{ steps.version.outputs.VERSION }}

      - name: Push latest Docker image
        run: |
          docker push ghcr.io/samiyasaleem/student-ml-api:latest

      - name: Push commit SHA Docker image
        run: |
          docker push ghcr.io/samiyasaleem/student-ml-api:${{ steps.commit.outputs.SHORT_SHA }}
